[project]
name = "fetch-trades"
version = "0.1.0"
description = "Fetch trading activities (FILL, NC, SPLIT) from Alpaca API"
requires-python = ">=3.12"
dependencies = [
    "alpaca-api @ file:///${PROJECT_ROOT}/../../packages/alpaca-api",
]

[project.scripts]
fetch-trades = "fetch_trades:main"

[tool.pdm]
package-dir = "src"
